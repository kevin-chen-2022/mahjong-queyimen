[package]
name = "mahjong-quedanmen"
version = "1.0.0"
description = "成都麻将缺一门训练工具"
authors = ["youxunchen"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[lib]
name = "mahjong_quedanmen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
